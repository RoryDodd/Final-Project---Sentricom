[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "python311Packages.virtualenv"]

[phases.install]
cmds = [
  "cd sentricom-api && python3 -m venv /opt/venv && . /opt/venv/bin/activate && pip install -r requirements.txt"
]

[start]
cmd = "cd sentricom-api && . /opt/venv/bin/activate && python -m uvicorn main:app --host 0.0.0.0 --port $PORT"
